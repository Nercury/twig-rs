# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/). Part of the local check list
# (reference/conventions.md): `cargo install cargo-deny --locked`, then `cargo deny check` (the graph below includes
# every feature, so the optional twig-iconv crate behind twig's `glibc-iconv` feature is checked too).

[graph]
all-features = true

[advisories]
# RustSec vulnerabilities fail by default; unmaintained and unsound crates do too, anywhere in the graph.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
# The licences of the workspace's own crates (NOTICE lists what each covers) and of the dependencies. Only what some
# crate needs is listed: cargo-deny warns about entries nothing uses.
allow = [
    "Apache-1.0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "PHP-3.01",
    "Unicode-3.0",
    "Zend-2.0",
    "Zlib",
    "dtoa",
]
# glibc-derived code (the optional twig-iconv crate, see NOTICE entry 18) is accepted there and nowhere else: the
# default build of twig and twig-value stays permissively licensed.
exceptions = [
    { crate = "twig-iconv", allow = ["LGPL-2.1-or-later"] },
]

[licenses.private]
# The unpublished crates (twig-fuzz, twig-test-support) are checked too.
ignore = false

[bans]
multiple-versions = "warn"
# Path dependencies without a version are wildcards (and block `cargo publish`): the workspace's path dependencies
# on published crates carry the release version ([workspace.dependencies]). Unpublished crates and dev-dependencies
# may keep version-less path dependencies (allow-wildcard-paths).
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[bans.std-replacements]
scope = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
