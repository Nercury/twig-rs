[package]
name = "twig"
version.workspace = true
description = "Twig template engine for Rust, aiming for exact compatibility with Twig for PHP."
documentation = "https://docs.rs/twig"
readme.workspace = true
keywords = ["twig", "template", "templating", "html"]
categories = ["template-engine", "web-programming"]
edition.workspace = true
rust-version.workspace = true
# BSD-3-Clause: twig-rs, the ported Twig 3.31.1 and its vendored fixtures (with the Zend Framework escaper code Twig
# adapted). PHP-3.01, Zend-2.0: ported php-src code. MIT: templates/fos_login.html.twig (FOSUserBundle). See NOTICE.
license = "BSD-3-Clause AND PHP-3.01 AND Zend-2.0 AND MIT"
repository.workspace = true
authors.workspace = true
# The published package is the library with its examples and licence files. The fixture suite, the oracle vectors,
# the benchmarks and the plans/reference/research documents stay in the repository; the tests that read them are
# left out with them, so they run in the workspace only.
include = [
    "/src/**",
    "/examples/**",
    "/templates/fos_login.html.twig",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
]

[package.metadata.docs.rs]
# `twig::to_context` and `twig::to_value`. Not `glibc-iconv`: the documented API is the default build's.
features = ["serde"]

[features]
# `twig::to_value` / `twig::to_context`: template data from anything that implements serde's `Serialize`.
serde = ["twig-value/serde"]
# glibc's exact iconv() for every charset (crate twig-iconv, LGPL-2.1-or-later) as the default charset converter of
# environments, instead of twig-value's clean-room converter for the Unicode charsets, ASCII and ISO-8859-1.
glibc-iconv = ["dep:twig-iconv"]

[dependencies]
regex.workspace = true
memchr.workspace = true
twig-value.workspace = true
twig-pcre.workspace = true
twig-unicode.workspace = true
twig-date.workspace = true
# Optional (feature `glibc-iconv`); LGPL-2.1-or-later, see crates/twig-iconv.
twig-iconv = { workspace = true, optional = true }

[dev-dependencies]
libtest-mimic.workspace = true
serde.workspace = true
# float_roundtrip: exact parsing of the floats of the oracle corpus (DateInterval fractions).
serde_json = { workspace = true, features = ["float_roundtrip"] }
# The fixture harness: the oracle corpus, its DATA trees as values, the PHP test classes.
twig-test-support.workspace = true
# The benchmarks in benches/ (see benches/README.md).
criterion.workspace = true

# The Twig 3.31.1 fixture suite (libtest-mimic runner, see the header of tests/fixtures.rs).
[[test]]
name = "fixtures"
path = "tests/fixtures.rs"
harness = false

# Criterion benchmarks over the scenarios in benches/scenarios/: lexing, parsing and compiling them, and rendering them.
[[bench]]
name = "compile"
harness = false

[[bench]]
name = "render"
harness = false

[lints]
workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# Every crate has the same version; the path dependencies below name it too.
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/Nercury/twig-rs"
authors = ["Nerijus Arlauskas <nercury@gmail.com>"]
# The sub-crates inherit it: crates.io shows the README of the repository for every crate.
readme = "README.md"

[workspace.dependencies]
# The published crates: a path for the workspace and a version for crates.io.
twig-value = { path = "crates/twig-value", version = "0.2.0" }
twig-iconv = { path = "crates/twig-iconv", version = "0.2.0" }
twig-unicode = { path = "crates/twig-unicode", version = "0.2.0" }
twig-pcre = { path = "crates/twig-pcre", version = "0.2.0" }
twig-timelib = { path = "crates/twig-timelib", version = "0.2.0" }
twig-date = { path = "crates/twig-date", version = "0.2.0" }
# Unpublished (dev-dependency only): no version, so `cargo package` drops it from twig's published manifest.
twig-test-support = { path = "crates/twig-test-support" }
regex = "1.13"
indexmap = "2.14"
foldhash = "0.2"
memchr = "2.8"
cc = "1"
libtest-mimic = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Without the default rayon and plotters features: fewer dependencies; HTML reports then need gnuplot installed.
criterion = { version = "0.8", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
