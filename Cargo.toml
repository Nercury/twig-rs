[package]
name = "twig"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Twig template engine for Rust, aiming for exact compatibility with Twig for PHP."
repository = "https://github.com/Nercury/twig-rs"
readme = "README.md"
license = "BSD-3-Clause"
authors = ["Nerijus Arlauskas <nercury@gmail.com>"]
keywords = ["twig", "template", "templating", "html"]
categories = ["template-engine"]

[dependencies]
regex = "1.13"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
