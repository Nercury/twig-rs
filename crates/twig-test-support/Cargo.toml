[package]
name = "twig-test-support"
version.workspace = true
description = "Fixture-harness support for twig-rs: Twig's integration fixtures (oracle corpus) as twig-value values."
edition.workspace = true
rust-version.workspace = true
# BSD-3-Clause: twig-rs and Twig's test classes. PHP-3.01, Zend-2.0: ported SPL, SimpleXML, Generator and
# increment code. See NOTICE.
license = "BSD-3-Clause AND PHP-3.01 AND Zend-2.0"
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
twig-value.workspace = true
serde.workspace = true
# float_roundtrip: exact parsing of the few JSON floats of the corpus (DateInterval fractions).
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
