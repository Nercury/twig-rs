[package]
name = "twig-timelib"
version = "0.1.0"
description = "Rust port of timelib (date/time parsing and arithmetic as used by PHP) for the twig template engine."
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
authors.workspace = true

[dev-dependencies]
serde.workspace = true
# float_roundtrip: exact parsing of the floats in the oracle vectors (latitudes, fractions).
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
