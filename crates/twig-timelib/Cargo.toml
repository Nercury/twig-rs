[package]
name = "twig-timelib"
version.workspace = true
description = "Rust port of timelib (date/time parsing and arithmetic as used by PHP) for the twig template engine."
documentation = "https://docs.rs/twig-timelib"
readme = "README.md"
keywords = ["twig", "timelib", "date", "time", "timezone"]
categories = ["date-and-time", "parser-implementations"]
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
authors.workspace = true
# Tests and their oracle vectors stay in the repository.
include = ["/src/**", "/README.md", "/LICENSE-timelib"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
serde.workspace = true
# float_roundtrip: exact parsing of the floats in the oracle vectors (latitudes, fractions).
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
