[package]
name = "twig-value"
version.workspace = true
description = "PHP-exact value model and builtin functions used by the twig template engine."
documentation = "https://docs.rs/twig-value"
readme = "README.md"
keywords = ["twig", "template", "value"]
categories = ["template-engine"]
edition.workspace = true
rust-version.workspace = true
# BSD-3-Clause: twig-rs; PHP's MT19937 (Matsumoto, Nishimura, Wagner). PHP-3.01, Zend-2.0: ported php-src code.
# MIT: musl and Arm optimized-routines math, libc++'s std::sort (zend_sort). ISC: snprintf's __cvt (Todd C. Miller).
# Zlib: strnatcmp (Martin Pool). Apache-1.0: snprintf's php_conv_fp (Apache Group). dtoa: zend_strtod (David M.
# Gay). Unicode-3.0: the transliteration replacements of the clean-room iconv (charset_basic), measured black-box,
# largely Unicode Character Database decompositions. No glibc code: glibc's exact iconv is the twig-iconv crate
# (LGPL). See NOTICE.
license = "BSD-3-Clause AND PHP-3.01 AND Zend-2.0 AND MIT AND ISC AND Zlib AND Apache-1.0 AND dtoa AND Unicode-3.0"
repository.workspace = true
authors.workspace = true
# Tests and their oracle vectors stay in the repository.
include = ["/src/**", "/README.md", "/LICENSE", "/NOTICE"]

[package.metadata.docs.rs]
# The `serde` module (`to_value`, `to_array`).
features = ["serde"]

[features]
# `serde::to_value` / `serde::to_array`: Rust data into PHP values through serde.
serde = ["dep:serde"]

[dependencies]
indexmap.workspace = true
foldhash.workspace = true
memchr.workspace = true
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Optional (feature `serde`). Not the workspace entry, which adds `derive`: the library only needs the traits.
serde = { version = "1", optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
