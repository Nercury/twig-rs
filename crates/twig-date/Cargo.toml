[package]
name = "twig-date"
version.workspace = true
description = "PHP-exact DateTime, DateTimeZone, DateInterval objects and date functions (ext/date) for the twig template engine."
documentation = "https://docs.rs/twig-date"
readme.workspace = true
keywords = ["twig", "date", "datetime", "timezone", "interval"]
categories = ["date-and-time"]
edition.workspace = true
rust-version.workspace = true
# BSD-3-Clause: twig-rs. PHP-3.01: ported ext/date code. Zend-2.0: InternalIterator (zend_interfaces.c). See NOTICE.
license = "BSD-3-Clause AND PHP-3.01 AND Zend-2.0"
repository.workspace = true
authors.workspace = true
# Tests and their oracle vectors stay in the repository.
include = ["/src/**", "/LICENSE", "/NOTICE"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
twig-value.workspace = true
twig-timelib.workspace = true

[dev-dependencies]
serde.workspace = true
# float_roundtrip: exact parsing of the floats in the oracle vectors (DateInterval fractions, coordinates).
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
