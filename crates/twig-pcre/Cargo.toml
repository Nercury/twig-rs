[package]
name = "twig-pcre"
version.workspace = true
description = "PCRE2 10.44 with PHP preg semantics for the twig template engine's matches operator."
documentation = "https://docs.rs/twig-pcre"
readme = "README.md"
keywords = ["twig", "pcre", "pcre2", "regex", "preg"]
categories = ["text-processing"]
edition.workspace = true
rust-version.workspace = true
# BSD-3-Clause: twig-rs, the checks of Twig's `matches` operator and the vendored PCRE2 (pcre2/). BSD-2-Clause: its
# JIT compiler sljit (pcre2/sljit/). PHP-3.01: the port of PHP's ext/pcre front end. See NOTICE and pcre2/LICENCE.
license = "BSD-3-Clause AND BSD-2-Clause AND PHP-3.01"
repository.workspace = true
authors.workspace = true
links = "twig_pcre2"
# Tests and their oracle vectors stay in the repository.
include = ["/build.rs", "/src/**", "/README.md", "/pcre2/**", "/LICENSE", "/NOTICE"]

[package.metadata.docs.rs]
all-features = true
# `src/lib.rs` enables `doc_cfg` under `docsrs`.
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["jit"]
## Compile PCRE2's JIT (sljit) like PHP's default `--with-pcre-jit` build. Without it every match runs in
## the interpreter, whose backtrack/recursion limit behaviour differs from PHP's JIT-enabled build.
jit = []

[build-dependencies]
cc.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
